name: Auto IPTV Update
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:

jobs:
  run-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 直接安装iptv-api需要的依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tqdm

      - name: 运行iptv-api生成源
        run: python main.py

      - name: 自动提交结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "🤖 Auto update iptv source" || echo "无变更"
          git push
